<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>WAYF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: single-column marketing page, sticky top nav, centered
     content column, rounded "pill" buttons and cards echoing the
     app's own visual language (brand blue + amber scan accent). */
  :root {
    --bg: #F7F8FC;
    --surface: #FFFFFF;
    --surface-alt: #EFF2FA;
    --border: #E2E6F0;
    --text: #14172B;
    --text-muted: #6B7280;
    --primary: #1F5BFF;
    --primary-dark: #1744B8;
    --accent: #FFC531;
    --on-primary: #FFFFFF;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --font-display: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0E1A;
      --surface: #151A2E;
      --surface-alt: #1B2140;
      --border: #2A3050;
      --text: #FFFFFF;
      --text-muted: #A6ACC4;
      --primary: #5B8CFF;
      --primary-dark: #83A8FF;
      --on-primary: #0B0E1A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0E1A;
    --surface: #151A2E;
    --surface-alt: #1B2140;
    --border: #2A3050;
    --text: #FFFFFF;
    --text-muted: #A6ACC4;
    --primary: #5B8CFF;
    --primary-dark: #83A8FF;
    --on-primary: #0B0E1A;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  a { color: var(--primary); }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p { line-height: 1.55; margin: 0; }

  .wrap { max-width: 760px; margin: 0 auto; }

  /* Top nav */
  header.topnav {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .topnav-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-block: 12px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; }
  .brand img { width: 26px; height: 26px; border-radius: 7px; display: block; }
  nav.links { display: flex; gap: 18px; flex-wrap: wrap; }
  nav.links a {
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
  nav.links a:hover { color: var(--primary); }

  select#langSelect {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
  }

  /* Hero */
  .hero { padding-block: 48px 32px; text-align: center; }
  .hero img.icon {
    width: 88px; height: 88px; border-radius: 22px;
    margin: 0 auto 20px; display: block;
    box-shadow: 0 12px 28px -12px rgba(31,91,255,0.45);
  }
  .hero .wayf {
    font-size: 15px; font-weight: 700; letter-spacing: 0.06em;
    color: var(--primary); text-transform: uppercase; margin-bottom: 6px;
  }
  .hero h1 { font-size: 40px; font-weight: 800; line-height: 1.12; }
  .hero p.sub {
    max-width: 480px; margin: 18px auto 0; color: var(--text-muted);
    font-size: 16px;
  }
  .hero p.note {
    max-width: 480px; margin: 14px auto 0; color: var(--text-muted);
    font-size: 12.5px; font-style: italic;
  }

  /* Barcode motif */
  .barcode { display: flex; gap: 3px; justify-content: center; margin: 28px 0 0; height: 30px; align-items: flex-end; }
  .barcode span { display: block; width: 3px; background: var(--primary); border-radius: 2px; opacity: 0.55; }

  section { padding-block: 36px; border-top: 1px solid var(--border); }
  section h2 { font-size: 24px; font-weight: 800; margin-bottom: 20px; }

  .features-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
  }
  @media (max-width: 480px) { .features-grid { grid-template-columns: 1fr; } }
  .feature-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 16px; min-width: 0;
  }
  .feature-card .ficon {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--surface-alt); display: flex; align-items: center;
    justify-content: center; margin-bottom: 10px;
  }
  .feature-card .ficon svg { width: 18px; height: 18px; stroke: var(--primary); }
  .feature-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .feature-card p { font-size: 13.5px; color: var(--text-muted); }

  .policy-block { margin-bottom: 22px; }
  .policy-block h3 { font-size: 15.5px; font-weight: 700; margin-bottom: 6px; }
  .policy-block p { font-size: 14.5px; color: var(--text-muted); }
  .updated {
    display: inline-block; font-family: var(--font-mono); font-size: 12px;
    color: var(--text-muted); background: var(--surface-alt);
    border-radius: 999px; padding: 4px 10px; margin-bottom: 18px;
  }

  .faq-item { padding-block: 14px; border-bottom: 1px solid var(--border); }
  .faq-item:last-child { border-bottom: none; }
  .faq-item h3 { font-size: 14.5px; font-weight: 700; margin-bottom: 5px; }
  .faq-item p { font-size: 13.5px; color: var(--text-muted); }

  .contact-card {
    margin-top: 10px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 16px; display: flex;
    align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .contact-card .email { font-family: var(--font-mono); font-size: 14px; }
  button.copy-btn {
    font-family: var(--font-display); font-weight: 700; font-size: 13px;
    color: var(--on-primary); background: var(--primary); border: none;
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  button.copy-btn:focus-visible, a:focus-visible, select:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }

  footer {
    padding-block: 28px 40px; text-align: center; font-size: 12.5px;
    color: var(--text-muted); padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
  }
</style>

onen über dich. Keine Registrierung, kein Profil, keine Nachverfolgung deiner Identität. Die einzigen Ausnahmen sind die Abfrage bei Open Food Facts und die Werbung, die unten erklärt werden."}, {"h": "Kamera und Fotos", "p": "WAYF fragt nach Kamerazugriff, um Barcodes zu scannen, und nach Zugriff auf deine Fotomediathek, damit du statt der Kamera ein vorhandenes Foto auswählen kannst. Beides wird vollständig auf deinem Gerät verarbeitet: Kein Bild und kein Video wird hochgeladen, auf einem Server gespeichert oder irgendwohin gesendet."}, {"h": "Scan-Verlauf", "p": "Wenn du „Gescannte Codes speichern“ in den Einstellungen aktivierst, werden die gescannten Codes nur lokal auf deinem Gerät gespeichert. Sie werden niemals an uns oder Dritte übertragen. Wenn du die Einstellung deaktivierst oder die App löschst, werden diese Daten entfernt. Deine Favoriten, Listen und gespeicherten Produktdaten bleiben ebenfalls nur auf deinem Gerät."}, {"h": "Open Food Facts", "p": "Um dir die Produktdaten anzuzeigen, sendet WAYF den Barcode an Open Food Facts (openfoodfacts.org), eine offene, gemeinschaftlich gepflegte Datenbank. Wie bei jeder Internetverbindung erhält dieser Dienst auch deine IP-Adresse. WAYF übermittelt weder deinen Namen noch deinen Verlauf oder deine Listen."}, {"h": "Werbung", "p": "WAYF zeigt Banner-Werbung über Google AdMob an. Um Werbung auszuliefern und zu messen, kann AdMob technische Informationen wie eine Gerätekennung, allgemeine Geräte- und App-Informationen sowie deinen ungefähren Standort erheben. Auf iOS wird Werbung nicht personalisiert angezeigt, es sei denn, du erteilst über Apples App-Tracking-Transparenz-System die Erlaubnis zur Nachverfolgung. Wie Google mit diesen Daten umgeht, erfährst du unter policies.google.com/privacy und support.google.com/admob/answer/6128543. Im Europäischen Wirtschaftsraum, im Vereinigten Königreich und in der Schweiz bitten wir um deine Einwilligung zur Werbung. Du kannst deine Auswahl jederzeit unter Einstellungen > D
